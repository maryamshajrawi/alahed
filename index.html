<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المسابقة رجعت | كتلة العهد الطلابي</title>
<meta property="og:title" content="اخدش لتعرف"><meta property="og:description" content="كتلة العهد الطلابي – في شي جديد مستنيكم">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#8a1013;--deep:#4a0709;--gold:#e8a317;--cream:#f5e6c8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#a41519 0,var(--red) 45%,var(--deep) 100%);color:var(--cream);font-family:Tajawal,Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);overflow:hidden;-webkit-user-select:none;user-select:none}
.top{font-size:18px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.card{position:relative;width:min(90vw,400px);height:min(66vh,520px);height:min(66dvh,520px);border-radius:28px;border:2px solid var(--gold);background:linear-gradient(160deg,#9c1418,#6a0b0e);box-shadow:0 20px 60px #0007;overflow:hidden}
.under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.6vh,10px);text-align:center;padding:clamp(8px,3vh,20px)}
.under img{height:min(24vh,130px);width:auto;max-width:34vw;min-height:0;object-fit:contain;flex-shrink:1}
h1{font-size:clamp(28px,min(12vw,7vh),56px);font-weight:800;color:var(--gold);line-height:1.1}
.under p{font-size:clamp(16px,min(5.5vw,3.4vh),24px);font-weight:700}
.under small{font-size:clamp(12px,2.2vh,15px);opacity:.85;line-height:1.6}
#foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .7s}
#foil.done{opacity:0;pointer-events:none}
.hint{position:absolute;top:50%;right:20%;width:54px;height:54px;margin-top:40px;border-radius:50%;border:3px solid #fffb;background:#ffffff40;animation:mv 2.2s ease-in-out infinite;pointer-events:none}
@keyframes mv{0%,100%{transform:translateX(0)}50%{transform:translateX(-150px) translateY(-24px)}}
.hint.off{display:none}
.skip{background:none;border:1px solid #f5e6c866;color:var(--cream);border-radius:20px;padding:6px 16px;font:inherit;font-size:13px;opacity:0;transition:opacity .6s;cursor:pointer}.skip.on{opacity:.8}
.foot{font-size:13px;opacity:.8;text-align:center}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
.sp{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--gold);animation:fly .9s ease-out forwards;pointer-events:none}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.hint,.pop,.sp{animation:none}#foil{transition:none}}
</style></head><body>

<div class="foot">كتلة العهد الطلابي</div>
<script>
const c=document.getElementById('foil'),x=c.getContext('2d'),card=document.getElementById('card');
let W,H,D,down=false,lx,ly,n=0,done=false;
function paint(){D=Math.min(devicePixelRatio||1,2);const r=c.getBoundingClientRect();W=c.width=r.width*D;H=c.height=r.height*D;
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#9a9aa2');g.addColorStop(.35,'#e4e4ea');g.addColorStop(.65,'#b3b3ba');g.addColorStop(1,'#d9d9df');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.globalAlpha=.12;x.strokeStyle='#fff';x.lineWidth=2*D;for(let i=-H;i<W;i+=14*D){x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke()}x.globalAlpha=1;
 x.fillStyle='#4a4a52';x.textAlign='center';x.font='800 '+(42*D)+'px Tajawal,sans-serif';x.fillText('اخدش هنا',W/2,H/2-10*D);
 x.font='700 '+(18*D)+'px Tajawal,sans-serif';x.fillText('بإصبعك أو بالماوس',W/2,H/2+24*D)}
function pos(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)*D,(e.clientY-r.top)*D]}
function reveal(){if(done)return;done=true;c.classList.add('done');document.getElementById('hint').classList.add('off');
 document.getElementById('under').classList.add('pop');
 for(let i=0;i<22;i++){const s=document.createElement('span');s.className='sp';const a=Math.random()*6.28,d=90+Math.random()*130;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');card.append(s);setTimeout(()=>s.remove(),1000)}
 document.querySelector('.top').textContent='رجعنا!'}
function cleared(){const d=x.getImageData(0,0,W,H).data;let t=0,k=0;for(let y=0;y<H;y+=12)for(let i=0;i<W;i+=12){t++;if(d[(y*W+i)*4+3]<40)k++}return k/t}
function stroke(e){if(!down||done)return;const[p,q]=pos(e);x.globalCompositeOperation='destination-out';x.lineWidth=52*D;x.lineCap='round';x.beginPath();x.moveTo(lx,ly);x.lineTo(p,q);x.stroke();lx=p;ly=q;document.getElementById('hint').classList.add('off');if(++n%10===0&&cleared()>.5)reveal()}
c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);stroke(e)});
c.addEventListener('pointermove',stroke);c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
paint();addEventListener('resize',()=>{if(!done)paint()});
</script></body></html>
